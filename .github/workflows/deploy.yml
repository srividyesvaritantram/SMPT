name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main   # triggers on every push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Create .env for build (inject GitHub Secrets as env vars) ──────
      - name: Create .env file
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env

      # ── 5. Build Vite app ─────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # ── 6. Deploy dist/ to Hostinger via FTP ─────────────────────────────
      # Skipped until FTP secrets are added in GitHub → Settings → Secrets → Actions
      # You can also deploy via Hostinger hPanel → Advanced → Git (no secrets needed)
      - name: Deploy to Hostinger FTP
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
