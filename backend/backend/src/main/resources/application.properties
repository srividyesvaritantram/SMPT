server.port=8080

# ── H2 in-memory DB (replace with MySQL/Postgres for production) ──────────────
spring.datasource.url=jdbc:h2:mem:srimahavidyesvari;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT (set these as environment variables in production) ────────────────────
# Local fallback only — override with env vars in production
app.jwt.secret=${JWT_SECRET:changeme-replace-this-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Add your Hostinger domain to the env var below
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
